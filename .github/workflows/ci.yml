name: CI

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_NOTIFY_USER_LIST: ""

  fmt:
    name: Format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check -p clearhash-cli -p clearhash-core -p clearhash-ecosystems -p clearhash-provenance -p clearhash-registry -p clearhash-sandbox -p clearhash-web -p clearhash-vercel

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  security:
    name: Security & License audit (cargo-deny & cargo-audit)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Security audit
        run: cargo audit

  test:
    name: Test (${{ matrix.os }})
    needs: [fmt, clippy, security]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace
      - run: cargo test --workspace

  coverage:
    name: Deterministic library coverage
    needs: [fmt, clippy, security]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      - name: Enforce 100% coverage for deterministic crates
        run: >-
          cargo llvm-cov --package clearhash-core --lib --all-features
          --fail-under-lines 100

  # Docker-gated integration test: only runs on push to main or staging (where ubuntu has docker daemon).
  integration:
    name: Integration (live npm verify)
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        # `--bin clearhash` is ambiguous (both clearhash-cli and clearhash-vercel define a
        # binary). `-p clearhash-cli` disambiguates by package.
        run: cargo build --release -p clearhash-cli
      - name: Verify a known-clean attested package
        run: ./target/release/clearhash verify npm:sigstore@2.3.1

  deploy:
    name: Deploy to Vercel
    needs: [secrets, coverage, integration]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger Vercel deploy hook
        env:
          VERCEL_DEPLOY_HOOK_STAGING: ${{ secrets.VERCEL_DEPLOY_HOOK_STAGING }}
          VERCEL_DEPLOY_HOOK_PROD: ${{ secrets.VERCEL_DEPLOY_HOOK_PROD }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            if [ -z "$VERCEL_DEPLOY_HOOK_STAGING" ]; then
              echo "Notice: VERCEL_DEPLOY_HOOK_STAGING is not set; skipping deploy."
              exit 0
            fi
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_STAGING"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            if [ -z "$VERCEL_DEPLOY_HOOK_PROD" ]; then
              echo "Error: VERCEL_DEPLOY_HOOK_PROD is required but not set."
              exit 1
            fi
            curl -sS -f -X POST "$VERCEL_DEPLOY_HOOK_PROD"
          fi
