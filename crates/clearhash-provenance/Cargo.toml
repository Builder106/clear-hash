[package]
name = "clearhash-provenance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Sigstore/Rekor verification of SLSA attestations for ClearHash."

[dependencies]
clearhash-core = { workspace = true }
clearhash-ecosystems = { workspace = true }
tokio = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22"
hex = { workspace = true }
sha2 = { workspace = true }
serde_json_canonicalizer = "0.4"
x509-parser = "0.18"
der = "0.8"
const-oid = { version = "0.10", features = ["db"] }
x509-cert = { version = "0.3", features = ["sct"] }
sigstore = { version = "0.15.0", default-features = false, features = ["rustls-tls", "rekor"] }

[dev-dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
url = { workspace = true }
