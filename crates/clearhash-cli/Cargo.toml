[package]
name = "clearhash-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "ClearHash CLI: rebuild-and-compare verification of package artifacts."
default-run = "clearhash"

[[bin]]
name = "clearhash"
path = "src/main.rs"

[[bin]]
name = "clearhash-npm"
path = "src/bin/clearhash-npm.rs"

[dependencies]
clearhash-core = { workspace = true }
clearhash-ecosystems = { workspace = true }
clearhash-registry = { workspace = true }
clearhash-provenance = { workspace = true }
clearhash-sandbox = { workspace = true }

tokio = { workspace = true }
clap = { version = "4", features = ["derive"] }
console = "0.16"
indicatif = "0.18"
anyhow = { workspace = true }
tempfile = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
semver = "1"
url = { workspace = true }
hex = { workspace = true }

[dev-dependencies]
base64 = "0.22"
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
